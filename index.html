<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Doğa ile Dönüş: su ve karbon ayak izini hesapla, rozetini kazan.">
<meta name="theme-color" content="#9fd3ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234b7a22'/%3E%3Cpath d='M12 4C9.5 7.3 7.5 9.7 7.5 12.3a4.5 4.5 0 0 0 9 0C16.5 9.7 14.5 7.3 12 4Z' fill='%23fff'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Doğa ile Dönüş Ayak İzi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Climate+Crisis:YEAR@1979..2050&family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a poster-like app. Each screen = a solid colour band (category) holding the question,
   over a paper sheet holding the answers. Wordmark and big numbers use Climate Crisis,
   whose YEAR axis melts the letters the way Arctic sea ice shrinks from 1979 to 2050. */
:root {
  --ink: #10261f;        /* text and outlines on colour bands, both themes */
  --paper: #f3f6f1;
  --sheet: #ffffff;
  --text: #10261f;
  --muted: #4f665e;
  --rule: #10261f;
  --soft-rule: #d5e0da;
  --glacier: #9fd3ea;
  --sun: #f4c54f;
  --dusk: #bdb6f2;
  --moss: #a8d58b;
  --clay: #f2a585;
  --water: #1f6fae; --food: #3f7a2a; --home: #c4562c;
  --page: #10261f;
  --wordmark: "Climate Crisis", "Arial Black", Impact, sans-serif;
  --display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1c18; --sheet: #172822; --text: #e6efe9; --muted: #9db3aa; --rule: #e6efe9; --soft-rule: #2a3e37;
    --water: #7cbbea; --food: #9ccb6b; --home: #f0956c; --page: #050c0a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1c18; --sheet: #172822; --text: #e6efe9; --muted: #9db3aa; --rule: #e6efe9; --soft-rule: #2a3e37;
  --water: #7cbbea; --food: #9ccb6b; --home: #f0956c; --page: #050c0a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.5; overflow: hidden; display: grid; place-items: center; }

.app { --cat: var(--glacier); position: relative; width: 100%; height: 100%; background: var(--paper); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden auto; overscroll-behavior: contain; }
@media (min-width: 560px) {
  body { background: var(--cat-page, var(--page)); }
  .app { width: 420px; height: min(860px, calc(100% - 48px)); border-radius: 28px; border: 2px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); }
}
.app[data-cat="water"] { --cat: var(--glacier); }
.app[data-cat="energy"] { --cat: var(--sun); }
.app[data-cat="move"] { --cat: var(--dusk); }
.app[data-cat="food"] { --cat: var(--moss); }
.app[data-cat="home"] { --cat: var(--clay); }
.i { width: 22px; height: 22px; flex: none; }

/* colour band */
.band { position: relative; background: var(--cat); color: var(--ink); padding: 14px 18px 0; display: grid; gap: 14px; transition: background .45s ease; z-index: 2; border-bottom: 2px solid var(--ink); }
.toprow { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.wm { flex: 1; min-width: 0; font-family: var(--wordmark); font-variation-settings: "YEAR" 1979; font-size: 17px; line-height: 1; letter-spacing: .01em; white-space: nowrap; }
.sq { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--ink); background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; transition: transform .1s, background .2s; }
.sq:hover { background: rgba(255,255,255,.35); }
.sq:active { transform: translateY(2px); }
.sq[hidden] { display: none !important; }
.sq .i { width: 20px; height: 20px; }
.segs { display: flex; gap: 4px; }
.segs[hidden] { display: none !important; }
.segs i { flex: 1; height: 5px; border-radius: 3px; background: rgba(16, 38, 31, .18); transition: background .3s; }
.segs i.on { background: var(--ink); }
.kicker { display: flex; align-items: baseline; gap: 10px; font: 700 13px var(--display); letter-spacing: .08em; text-transform: uppercase; }
.kicker .no { font-family: var(--wordmark); font-variation-settings: "YEAR" 1979; font-size: 15px; letter-spacing: 0; }
.qtitle { font: 700 27px/1.15 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.qsub { margin: -6px 0 0; font-size: 15px; opacity: .78; }
.scene { display: block; width: calc(100% + 36px); margin: 0 -18px; height: 64px; }
.band-body { display: grid; gap: 12px; }
.band-body.in { animation: bandIn .45s cubic-bezier(.2,1.1,.3,1) both; }
@keyframes bandIn { from { opacity: 0; transform: translateY(10px); } }

/* paper sheet */
.screen { position: relative; overflow-x: clip; }
.page { position: relative; padding: 18px 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }
.page.in { animation: pageIn .4s cubic-bezier(.2,1.1,.3,1) both; }
.page.out { position: absolute; inset: 0 0 auto 0; animation: pageOut .2s ease-in both; pointer-events: none; }
@keyframes pageIn { from { opacity: 0; transform: translateY(18px); } }
@keyframes pageOut { to { opacity: 0; transform: translateY(-10px); } }

.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; text-align: left; font: 600 17px var(--display); color: var(--text); background: var(--sheet); border: 2px solid var(--rule); border-radius: 14px; padding: 14px 16px; cursor: pointer; box-shadow: 0 4px 0 var(--rule); transition: transform .08s, box-shadow .08s, background .2s; animation: rise .4s cubic-bezier(.2,1.1,.3,1) both; }
.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rule); }
.opt .oi { display: grid; place-items: center; font: 400 15px var(--wordmark); font-variation-settings: "YEAR" 1979; }
.opt small { display: block; font: 500 13px var(--body); color: var(--muted); margin-top: 1px; }
.opt .key { font: 500 12px var(--mono); color: var(--muted); }
.opt.sel { background: var(--cat); color: var(--ink); }
.opt.sel small, .opt.sel .key { color: var(--ink); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

.numbox { background: var(--sheet); border: 2px solid var(--rule); border-radius: 18px; padding: 22px 16px 18px; display: grid; gap: 14px; box-shadow: 0 4px 0 var(--rule); }
.num { display: flex; align-items: center; justify-content: center; gap: 18px; }
.num button { width: 52px; height: 52px; border-radius: 14px; border: 2px solid var(--rule); background: var(--sheet); color: var(--text); cursor: pointer; display: grid; place-items: center; box-shadow: 0 3px 0 var(--rule); transition: transform .08s, box-shadow .08s; }
.num button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--rule); }
.num output { font: 400 64px/1 var(--wordmark); font-variation-settings: "YEAR" 1979; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.num output.bump { animation: bump .22s ease; }
@keyframes bump { 50% { transform: scale(1.12); } }
.num-unit { text-align: center; color: var(--muted); font: 600 15px var(--display); margin-top: -6px; }
input[type=range] { width: 100%; accent-color: var(--text); }

.billbox { background: var(--sheet); border: 2px solid var(--rule); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; box-shadow: 0 4px 0 var(--rule); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--rule); border-radius: 12px; overflow: hidden; }
.seg button { font: 700 14px var(--display); border: 0; background: transparent; color: var(--text); padding: 9px; cursor: pointer; }
.seg button + button { border-left: 2px solid var(--rule); }
.seg button[aria-pressed=true] { background: var(--text); color: var(--sheet); }
.field { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--rule); padding: 2px 2px 6px; }
.field input { flex: 1; min-width: 0; width: 100%; font: 400 40px var(--wordmark); font-variation-settings: "YEAR" 1979; border: 0; background: transparent; color: var(--text); padding: 0; }
.field input:focus { outline: none; }
.field span { font: 700 16px var(--display); color: var(--muted); }
.conv { display: flex; align-items: center; gap: 6px; font: 500 14px var(--mono); color: var(--muted); min-height: 1.5em; }
.conv .i { width: 16px; height: 16px; }

/* action bar */
.actionbar { position: sticky; bottom: 0; z-index: 3; padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-top: 2px solid var(--rule); display: grid; gap: 8px; }
.alt { display: flex; gap: 8px; }
.btn { font: 700 17px var(--display); border: 2px solid var(--rule); border-radius: 14px; padding: 14px 18px; background: var(--text); color: var(--paper); cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; box-shadow: 0 4px 0 color-mix(in srgb, var(--rule) 55%, transparent); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rule); }
.btn.ghost { background: var(--sheet); color: var(--text); padding: 10px 12px; font-size: 15px; box-shadow: none; }
.btn .i { width: 20px; height: 20px; }
.hint { text-align: center; font: 500 13px var(--body); color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }

/* intro */
html, button, input, .opt, .num button { touch-action: manipulation; }
.melt { font-family: var(--wordmark); font-size: min(14.2vw, 7dvh, 62px); line-height: .95; margin: 2px 0 0; font-variation-settings: "YEAR" 1979; letter-spacing: -.01em; }
.yr { display: grid; gap: 4px; }
.yr-top { display: flex; justify-content: space-between; align-items: baseline; font: 500 12px var(--mono); }
.yr-top b { font: 400 22px/1 var(--wordmark); font-variation-settings: "YEAR" 1979; }
.yr input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; cursor: ew-resize; touch-action: pan-y; }
.yr input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--ink); border-radius: 2px; }
.yr input[type=range]::-moz-range-track { height: 3px; background: var(--ink); border-radius: 2px; }
.yr input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -11.5px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 2px 0 var(--ink); }
.yr input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); }
.yr-hint { font: 600 12px var(--display); opacity: .75; }
.lede { font: 600 21px/1.3 var(--display); margin: 0; text-wrap: balance; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; }
.cats span { display: inline-flex; align-items: center; gap: 6px; font: 600 14px var(--display); border: 2px solid var(--rule); border-radius: 99px; padding: 4px 12px 4px 6px; background: var(--sheet); animation: rise .4s both; }
.cats b { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
.small { font-size: 13px; color: var(--muted); margin: 0; }

/* result */
.big { font-family: var(--wordmark); font-size: clamp(72px, 24vw, 104px); line-height: .9; font-variation-settings: "YEAR" 1979; transition: font-variation-settings 2.6s cubic-bezier(.5,0,.3,1); font-variant-numeric: tabular-nums; }
.bigunit { font: 700 16px var(--display); margin-top: -4px; }
.stamp { justify-self: start; display: inline-flex; align-items: center; gap: 8px; font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .06em; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 12px; background: rgba(255,255,255,.4); animation: stamp .5s 1.2s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes stamp { from { opacity: 0; transform: scale(1.6) rotate(-8deg); } }
.card { background: var(--sheet); border: 2px solid var(--rule); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
.card .lab { font: 700 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.wnum { font: 400 44px/1 var(--wordmark); font-variation-settings: "YEAR" 1979; }
.wnum small { font: 700 15px var(--display); margin-left: 6px; color: var(--muted); }
.ref { position: relative; height: 12px; border: 2px solid var(--rule); border-radius: 99px; }
.ref .me { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: var(--text); transition: width 1.2s cubic-bezier(.2,1,.3,1); }
.ref .avg { position: absolute; top: -7px; bottom: -7px; width: 3px; background: var(--home); }
.cmp { font-size: 13px; color: var(--muted); } .cmp b { color: var(--text); }
h3 { font: 700 13px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 10px 0 -2px; }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; border: 2px solid var(--rule); border-radius: 16px; background: var(--sheet); overflow: hidden; }
.list > li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 13px 14px; animation: rise .45s both; }
.list > li + li { border-top: 2px solid var(--soft-rule); }
.list .n { font: 400 20px/1.2 var(--wordmark); font-variation-settings: "YEAR" 1979; }
.list .i { width: 22px; height: 22px; margin-top: 1px; }
.list b { display: block; font: 700 16px/1.3 var(--display); } .list span, .list p { font-size: 14px; color: var(--muted); margin: 2px 0 0; }
.bars { display: grid; gap: 9px; }
.br { display: grid; grid-template-columns: 92px minmax(0, 1fr) 58px; gap: 8px; align-items: center; font-size: 13px; }
.br .t { height: 10px; border: 1.5px solid var(--rule); border-radius: 99px; overflow: hidden; }
.br .f { height: 100%; width: 0; background: var(--text); transition: width 1s cubic-bezier(.2,1,.3,1); }
.br .v { text-align: right; font: 500 12px var(--mono); }
.note { font-size: 12px; color: var(--muted); margin: 0; }
details.data { font-size: 13px; }
details.data summary { cursor: pointer; font: 700 14px var(--display); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--soft-rule); vertical-align: top; }
td.n { font-family: var(--mono); white-space: nowrap; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.row2 .btn.ghost { width: auto; padding: 0 16px; }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: var(--paper); font: 600 14px var(--display); padding: 10px 16px; border-radius: 12px; transition: all .3s; pointer-events: none; z-index: 5; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
/* group board */
.jrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.jf { flex: 1 1 140px; display: grid; gap: 4px; font: 600 13px var(--display); color: var(--muted); }
.jf input { font: 600 17px var(--display); color: var(--text); background: var(--paper); border: 2px solid var(--rule); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.btn[disabled] { opacity: .5; }
.gcode { font: 400 clamp(44px, 14vw, 64px)/1 var(--wordmark); font-variation-settings: "YEAR" 1979; letter-spacing: .02em; }
.gstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gstats:empty { display: none; }
.gstats div { border: 2px solid var(--ink); border-radius: 12px; padding: 8px; display: grid; gap: 2px; background: rgba(255,255,255,.35); }
.gstats b { font: 400 20px/1 var(--wordmark); white-space: nowrap; font-variation-settings: "YEAR" 1979; }
.gstats span { font: 600 11px/1.2 var(--display); }
.list.board > li { grid-template-columns: 22px minmax(0, 1fr) 52px 84px; gap: 8px; align-items: center; padding: 12px 14px; }
.list.board > li.hd { padding: 8px 14px; font: 700 11px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); animation: none; }
.list.board > li.hd span:nth-child(n+3), .list.board .tv { text-align: right; }
.list.board .tv.w { color: var(--water); }
.list.board .nm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 700 17px var(--display); }
.list.board .tv { font: 400 17px/1 var(--wordmark); white-space: nowrap; font-variation-settings: "YEAR" 1979; }
.list.board .tv small { font: 700 13px var(--display); margin-left: 3px; color: var(--muted); }
.note a { color: var(--text); font-weight: 600; }
.card[hidden] { display: none; }
.chg { font: 700 12px var(--mono); font-style: normal; border: 2px solid var(--rule); border-radius: 99px; padding: 3px 8px; white-space: nowrap; color: var(--muted); }
.chg.down { background: var(--moss); color: var(--ink); border-color: var(--ink); }
.chg.up { background: var(--clay); color: var(--ink); border-color: var(--ink); }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.melt.gt { font-size: min(11.5vw, 6.4dvh, 52px); line-height: 1.04; margin-bottom: 12px; }
.gitem { display: flex; align-items: center; gap: 12px; }
.gitem .i { width: 40px; height: 40px; flex: none; stroke-width: 1.7; }
.gscale { display: flex; justify-content: space-between; font: 500 11px var(--mono); color: var(--muted); margin-top: -8px; }
.gline { position: relative; height: 12px; border: 2px solid var(--rule); border-radius: 99px; margin: 6px 0 4px; }
.gline i { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 2px solid var(--ink); }
.gline .ga { background: var(--glacier); z-index: 1; animation: pop .5s .35s cubic-bezier(.2,1.6,.4,1) both; }
.gline .gg { background: var(--sheet); width: 12px; height: 12px; margin: -6px 0 0 -6px; border-color: var(--rule); }
.gpts { display: flex; align-items: baseline; justify-content: center; gap: 8px; animation: pop .5s .5s cubic-bezier(.2,1.6,.4,1) both; }
.gpts b { font: 400 56px/1 var(--wordmark); font-variation-settings: "YEAR" 1979; }
.gpts span { font: 700 16px var(--display); color: var(--muted); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.list.gres > li { grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; }
.list.gres em { font: 400 18px var(--wordmark); font-style: normal; font-variation-settings: "YEAR" 1979; }
.list.board.gb > li { grid-template-columns: 22px minmax(0, 1fr) 70px; }
.num.gnum { gap: 10px; }
.num.gnum button { flex: none; }
.num.gnum output { flex: 1; min-width: 0; font-size: clamp(34px, 11vw, 50px); }
@media (max-height: 760px) { .cats { display: none; } }
.gtx { margin: 0; color: var(--text); font-size: 14px; }
.gimp { border-left-width: 8px; border-left-color: var(--cat); }
.gscl { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 0; }
.gscl + .gscl { border-top: 2px solid var(--soft-rule); }
.gscl .k { font: 700 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.gscl b { display: block; font: 700 17px var(--display); }
.gscl div span { font-size: 13px; color: var(--muted); }
.gscl div span.gtx { font-size: 14px; color: var(--text); }
.gscl .k { overflow-wrap: anywhere; }
.gentry { margin-top: 2px; padding: 10px 14px; font-size: 16px; }
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<main class="app" id="app" data-cat="water">
  <header class="band" id="band">
    <div class="toprow">
      <button class="sq" id="backBtn" type="button" aria-label="Geri" hidden></button>
      <span class="wm">Doğa ile Dönüş</span>
      <button class="sq" id="soundBtn" type="button" aria-label="Sesi kapat"></button>
    </div>
    <div class="segs" id="segs" hidden></div>
    <div class="band-body" id="bandBody"></div>
    <svg class="scene" id="scene" viewBox="0 0 420 64" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  </header>
  <section class="screen" id="screen"></section>
  <footer class="actionbar" id="actions"></footer>
  <div class="toast" id="toast" role="status"></div>
</main>

<script>
// ===== Fiyatlar ve katsayılar: güncellemek için sadece bu bloğu düzenle =====
const DATA = {
  updated: "22 Ekim 2026",

function waterTlToM3(tl) {
  let m3 = 0;
  for (const [size, price] of DATA.price.waterTiers.v) { const cost = size * price; if (tl <= cost) return m3 + tl / price; m3 += size; tl -= cost; }
  return m3;
}
function waterM3ToTl(m3) {
  let tl = 0;
  for (const [size, price] of DATA.price.waterTiers.v) { const u = Math.min(m3, size); tl += u * price; m3 -= u; if (m3 <= 0) break; }
  return tl;
}
// bill answer: {mode: "tl"|"q"|"none"|"unk", v}
function billQty(id) {
  const b = A[id]; if (!b) return null;
  if (b.mode === "none") return 0;
  if (b.mode === "unk") return null;
  if (b.mode === "q") return b.v;
  const st = STEPS.find(s => s.id === id);
  return st.water ? waterTlToM3(b.v) : b.v / st.price();
}
function calc() {

  if (dorm) {
    elecPP = E.dormElec.v + (A.heater === "elektrik" ? E.heater.v : 0) - (A.room > 1 ? 5 * (A.room - 1) : 0);
    gasPP = A.heater === "elektrik" ? E.dormGas.v * .3 : E.dormGas.v;
  } else {
    const e = billQty("elec"), g = billQty("gas");

    gasPP = g == null ? (estimated.push("doğalgaz"), E.homeGas.v) : g / people;
  }
  const showerMin = (A.showerFreq ?? 7) / 7 * (A.shower ?? 8);
  const habitL = showerMin * W.shower.v + W.toilet.v + (A.tap ? W.tapOpen.v : 4) + (dorm ? 5 : W.kitchen.v);
  const wq = dorm ? null : billQty("water");
  if (wq == null) { directL = habitL; if (!dorm) estimated.push("su"); } else directL = wq * 1000 / 30 / people;

  let car = 0;

    else { const f = billQty("fuel"); car = (f || 0) * C[A.fuelType].v * 12; }
  }
  const transitH = (A.commute === "toplu" || A.commute === "servis") ? (A.transit || 0) : 0;
  const co2 = {
    "Ev enerjisi": (elecPP * C.elec.v + gasPP * C.gas.v) * 12,
    "Ulaşım": car + transitH * 52 * C.transit.v,
    "Uçuş": (A.flyDom || 0) * C.flyDom.v + (A.flyInt || 0) * C.flyInt.v,
    "Beslenme": C.diet.v[A.diet || "medium"],
    "Alışveriş": (A.clothes || 0) * 12 * C.clothes.v + (A.bottle || 0) * 52 * C.bottle.v[A.bottleSize || "small"]
  };
  const water = {
    "Evde kullanım": directL,
    "Yiyecek": W.diet.v[A.diet || "medium"],
    "Kıyafet": (A.clothes || 0) * 12 * W.clothes.v / 365,
    "Pet şişe": (A.bottle || 0) / 7 * W.bottle.v[A.bottleSize || "small"]
  };

}

// Firestore'un tipli değer biçimi
const toFs = v => typeof v === "string" ? { stringValue: v } : Number.isInteger(v) ? { integerValue: String(v) } : typeof v === "number" ? { doubleValue: v } : { mapValue: { fields: Object.fromEntries(Object.entries(v).map(([k, x]) => [k, toFs(x)])) } };
const fromFs = f => "stringValue" in f ? f.stringValue : "integerValue" in f ? +f.integerValue : "doubleValue" in f ? f.doubleValue : "mapValue" in f ? Object.fromEntries(Object.entries(f.mapValue.fields || {}).map(([k, x]) => [k, fromFs(x)])) : null;

async function saveAttempt(group, name, r) {
  const url = `${fsBase()}/groups/${encodeURIComponent(group)}/members/${encodeURIComponent(memberKey(name))}`;
  const attempt = { co2: Math.round(r.totalCo2 * 100) / 100, water: Math.round(r.totalW), at: new Date().toISOString(), home: A.home || "" };
  const res = await fetch(`${url}?key=${FIREBASE.apiKey}`);
  let fields;
  if (res.status === 404) fields = { name, first: attempt, last: attempt, attempts: 1 };
  else if (res.ok) { const doc = await res.json(); const cur = Object.fromEntries(Object.entries(doc.fields || {}).map(([k, x]) => [k, fromFs(x)])); fields = { name, first: cur.first || attempt, last: attempt, attempts: (cur.attempts || 0) + 1 }; }
  else throw new Error("okunamadı " + res.status);
  const body = { fields: Object.fromEntries(Object.entries(fields).map(([k, v]) => [k, toFs(v)])) };
  const put = await fetch(`${url}?key=${FIREBASE.apiKey}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!put.ok) throw new Error("kaydedilemedi " + put.status);
  return fields;
}
async function loadGroup(group) {
  const res = await fetch(`${fsBase()}/groups/${encodeURIComponent(group)}/members?pageSize=300&key=${FIREBASE.apiKey}`);
  if (!res.ok) throw new Error("okunamadı " + res.status);
  const j = await res.json();
  return (j.documents || []).map(d => Object.fromEntries(Object.entries(d.fields || {}).map(([k, x]) => [k, fromFs(x)])));
}

function wireJoin(el, r) {
  const msg = el.querySelector("#jMsg"), btn = el.querySelector("#jSave");
  el.querySelector("#jGroup").oninput = e => { const p = e.target.selectionStart; e.target.value = cleanCode(e.target.value); e.target.setSelectionRange(p, p); };

    btn.disabled = true; msg.textContent = "Kaydediliyor…";
    try {

    } catch (e) { btn.disabled = false; msg.textContent = "Kaydedilemedi. İnternet bağlantını kontrol edip tekrar dene."; }
  };
}

let boardTimer = null;
function board(groupArg) {
  clearInterval(boardTimer);
  cur = "board"; backBtn.hidden = false; segs.hidden = true; document.querySelector(".wm").style.visibility = "";
  const group = cleanCode(groupArg || (store.get("me") || {}).group || "");
  setCat("food", "food");
  setBand(`<div class="kicker"><span>Grup panosu</span></div><div class="gcode">${group ? esc(group) : "KOD?"}</div><div class="gstats" id="gstats"></div>`);
  const el = swap(`
    <div class="card" ${group ? "hidden" : ""} id="gCard"><span class="lab">Grup kodu</span><div class="jrow"><label class="jf" style="flex:1"><span class="sr">Grup kodu</span><input id="bGroup" maxlength="12" value="${esc(group)}" placeholder="Örn. DOGA1"></label><button class="btn ghost" id="bGo" type="button" style="width:auto">Aç</button></div></div>
    <div id="bList"><p class="small">${boardReady() ? (group ? "Yükleniyor…" : "Grup liderinin verdiği kodu yaz.") : "Pano henüz bir veritabanına bağlanmadı."}</p></div>
    <p class="note">Sıralama, ilk denemeye göre en çok azaltana göre. Karbon yıllık ton CO₂, su günlük litre. ${group ? `<a href="#" id="chg">Grubu değiştir</a>` : ""}</p>`);
  actions.innerHTML = `<button class="btn" id="bTest" type="button">${ic("redo")}Testi çöz</button>`;
  actions.querySelector("#bTest").onclick = () => { for (const k in A) delete A[k]; sfx.start(); go(STEPS.indexOf(visible()[0]), 1); };
  const inp = el.querySelector("#bGroup");
  inp.oninput = () => { inp.value = cleanCode(inp.value); };
  const open = () => { const g = cleanCode(inp.value); if (g) { sfx.tap(); board(g); } };
  el.querySelector("#bGo").onclick = open;
  el.querySelector("#chg")?.addEventListener("click", e => { e.preventDefault(); el.querySelector("#gCard").hidden = false; inp.focus(); }); inp.onkeydown = e => { if (e.key === "Enter") open(); };
  if (!boardReady() || !group) return;
  const render = async () => {
    try {
      const ms = await loadGroup(group);
      const list = el.querySelector("#bList"); if (!list.isConnected) return;
      if (!ms.length) { list.innerHTML = `<p class="small">Bu grupta henüz kimse yok. İlk sen ol.</p>`; document.getElementById("gstats").innerHTML = ""; return; }
      const rows = ms.map(m => ({ ...m, drop: (m.first?.co2 || 0) - (m.last?.co2 || 0) })).sort((a, b) => b.drop - a.drop || a.last.co2 - b.last.co2);
      const avg = rows.reduce((s, m) => s + m.last.co2, 0) / rows.length;
      document.getElementById("gstats").innerHTML = `<div><b>${rows.length}</b><span>kişi</span></div><div><b>${fmt(avg, 1)} t</b><span>ortalama CO₂</span></div><div><b>${fmt(rows.reduce((s, m) => s + m.last.water, 0) / rows.length)}</b><span>ortalama L su / gün</span></div>`;
      list.innerHTML = `<ol class="list board"><li class="hd"><span></span><span></span><span>t CO₂</span><span>L su</span></li>${rows.map((m, k) => {
        const pct = m.first.co2 ? Math.round((m.last.co2 / m.first.co2 - 1) * 100) : 0;
        const chip = m.attempts > 1 && pct !== 0 ? `<em class="chg ${pct < 0 ? "down" : "up"}">${pct < 0 ? "▼" : "▲"} %${Math.abs(pct)}</em>` : "";
        return `<li><span class="n">${k + 1}</span><b class="nm">${esc(m.name)}${chip}</b><span class="tv">${fmt(m.last.co2, 1)}<small>t</small></span><span class="tv w">${fmt(m.last.water)}</span></li>`;
      }).join("")}</ol>`;
    } catch (e) { const list = el.querySelector("#bList"); if (list.isConnected) list.innerHTML = `<p class="small">Pano yüklenemedi. İnternet bağlantını kontrol et.</p>`; }
  };
  render(); boardTimer = setInterval(() => { if (cur === "board") render(); else clearInterval(boardTimer); }, 15000);
}

// Ölçek: Türkiye 85,7 milyon kişi (TÜİK 2025), dünya 8,2 milyar (BM 2025)
// İstanbul günlük şebeke suyu ~3 milyon m³ (İSKİ); Türkiye toplam su kullanımı tarım dahil ~57 milyar m³/yıl (DSİ)
const SCALE_TR = 85.7e6, SCALE_W = 8.2e9, IST_DAY = 3e9, TR_DAY = 57e12 / 365;
const bigL = v => v >= 1e12 ? fmt(v / 1e12, 1) + " trilyon" : v >= 1e9 ? fmt(v / 1e9, 1) + " milyar" : fmt(v / 1e6, 1) + " milyon";
const days = d => d >= 365 ? `${fmt(d / 365, 1)} yıllık` : d >= 1 ? `${fmt(d, d < 10 ? 1 : 0)} günlük` : `${fmt(d * 24, 0)} saatlik`;
const ROUNDS = 8, GMIN = 1, GMAX = 20000;
const toG = p => GMIN * Math.pow(GMAX / GMIN, p / 1000);
const toP = g => Math.round(Math.log(g / GMIN) / Math.log(GMAX / GMIN) * 1000);
const nice = g => { const e = Math.pow(10, Math.max(0, Math.floor(Math.log10(g)) - 1)); return Math.max(1, Math.round(g / e) * e); };
const gScore = (g, a) => Math.max(0, Math.round(100 * (1 - Math.abs(Math.log10(g / a)))));
const GCATS = ["water", "food", "move", "energy", "home"];
let G = null;

function guessIntro() {
  cancelAnimationFrame(meltAnim); clearInterval(boardTimer);
  cur = "guess"; history = []; backBtn.hidden = false; segs.hidden = true;
  document.querySelector(".wm").style.visibility = "";
  setCat("water");
  setBand(`<div class="kicker"><span>Tahmin et</span></div><div class="melt gt">BU KAÇ<br>LİTRE SU?</div>`);
  const best = store.get("guessBest");
  swap(`<p class="lede">Bir tişört, bir fincan kahve, bir telefon. Üretilmeleri için ne kadar su harcanıyor?</p>
    <div class="card"><span class="lab">Nasıl oynanır</span>
      <p class="small" style="margin:0">${ROUNDS} ürün gelecek. Kaydırıcıyla kaç litre su harcandığını tahmin et. Gerçeğe ne kadar yakınsan o kadar puan, her ürün en fazla 100.</p></div>
    ${best ? `<p class="small">En iyi puanın: <b>${fmt(best)}</b> / ${ROUNDS * 100}</p>` : ""}`);
  actions.innerHTML = `<div class="row2"><button class="btn" id="gStart" type="button">Oyuna başla ${ic("right")}</button><button class="btn ghost" id="gBoard" type="button" aria-label="Oyun panosu">${ic("users")}</button></div>`;
  actions.querySelector("#gStart").onclick = () => {
    audio(); sfx.start();
    const pool = ITEMS.slice().sort(() => Math.random() - .5).slice(0, ROUNDS);
    G = { pool, k: 0, res: [] }; guessRound();
  };
  actions.querySelector("#gBoard").onclick = () => { audio(); sfx.tap(); guessEnd(true); };
}

function guessRound() {
  const it = G.pool[G.k], cat = GCATS[G.k % GCATS.length];
  cur = "gplay"; setSegs(G.k + 1, ROUNDS); setCat(cat);
  setBand(`<div class="kicker"><span class="no">${pad(G.k + 1)}</span><span>Tahmin et</span></div>
    <div class="gitem">${ic(it.i)}<h2 class="qtitle">${it.n}</h2></div><p class="qsub">Üretimi için kaç litre su harcanır?</p>`);
  let p = toP(150);
  const el = swap(`<div class="numbox"><div class="num gnum"><button type="button" data-d="-1" aria-label="Azalt">${ic("minus")}</button><output id="gv">${fmt(nice(toG(p)))}</output><button type="button" data-d="1" aria-label="Artır">${ic("plus")}</button></div>
    <div class="num-unit">litre</div>
    <input type="range" id="gr" min="0" max="1000" step="1" value="${p}" aria-label="Tahminin, litre">
    <div class="gscale"><span>1</span><span>10</span><span>100</span><span>1.000</span><span>10.000</span></div></div>`);
  const out = el.querySelector("#gv"), rng = el.querySelector("#gr");
  let lastV = nice(toG(p));
  const set = q => {
    p = Math.min(1000, Math.max(0, q)); rng.value = p;
    const v = nice(toG(p)); if (v === lastV) return;
    const up = v > lastV; lastV = v; out.textContent = fmt(v);
    out.classList.remove("bump"); void out.offsetWidth; out.classList.add("bump");
    (up ? sfx.up : sfx.down)();
  };
  el.querySelectorAll("[data-d]").forEach(b => b.onclick = () => set(p + +b.dataset.d * 25));
  rng.oninput = () => set(+rng.value);
  actions.innerHTML = `<button class="btn" id="gGo" type="button">Tahminim bu ${ic("check")}</button>`;
  actions.querySelector("#gGo").onclick = () => reveal(it, lastV);
  sfx.next();
}

function reveal(it, g) {
  const s = gScore(g, it.v), r = g / it.v;
  G.res.push({ n: it.n, g, a: it.v, s });
  const msg = s >= 90 ? "Neredeyse tam isabet!" : s >= 70 ? "Çok yakın!" : s >= 40 ? "Fena değil." : r < 1 ? "Gerçek çok daha fazla!" : "Gerçek çok daha az!";
  const r1 = x => x < 10 ? (Math.round(x * 10) / 10).toLocaleString("tr-TR") : fmt(x);
  const cmp = it.v >= 900 ? `${r1(it.v / 150)} dolu küvet` : `${r1(it.v / 9)} dakikalık duş`;
  const pos = v => (toP(Math.min(GMAX, Math.max(GMIN, v))) / 10).toFixed(1);
  const el = swap(`<div class="card grev">
      <span class="lab">Gerçek</span>
      <div class="wnum"><span id="ga">0</span><small>litre</small></div>
      <div class="gline"><i class="ga" style="left:${pos(it.v)}%"></i><i class="gg" style="left:${pos(g)}%"></i></div>
      <span class="cmp">Senin tahminin <b>${fmt(g)} L</b>. ${msg}</span></div>
    <div class="gpts"><b>+${s}</b><span>puan</span></div>
    <div class="card"><span class="lab">Bu ne kadar su?</span><p class="small gtx">Yaklaşık ${cmp} kadar. ${it.d}</p></div>
    <div class="card gimp"><span class="lab">Doğaya etkisi</span><p class="small gtx">${it.e}</p></div>
    <div class="card"><span class="lab">Herkes bir tane tüketse</span>
      <div class="gscl"><span class="k">Türkiye</span><div><b>${bigL(it.v * SCALE_TR)} litre</b><span>85,7 milyon kişi. İstanbul'un ${days(it.v * SCALE_TR / IST_DAY)} şebeke suyu kadar.</span></div></div>
      <div class="gscl"><span class="k">Dünya</span><div><b>${bigL(it.v * SCALE_W)} litre</b><span>8,2 milyar kişi. Türkiye'nin tarım dahil ${days(it.v * SCALE_W / TR_DAY)} toplam su kullanımı kadar.</span></div></div></div>`);
  const last = G.k === ROUNDS - 1;
  actions.innerHTML = `<button class="btn" id="gNx" type="button">${last ? "Sonucu gör" : "Sıradaki ürün"} ${ic("right")}</button>`;
  actions.querySelector("#gNx").onclick = () => { sfx.tap(); if (last) guessEnd(); else { G.k++; guessRound(); } };
  [0, .12, .24].forEach((d, k) => setTimeout(() => sfx.drop(), d * 1000 + k));
  setTimeout(() => {
    countUp(el.querySelector("#ga"), it.v, 0, 1100);
    if (s >= 70) { sfx.pick(5); burstAt(el.querySelector(".gpts"), s >= 90 ? 24 : 12); } else sfx.down();
  }, 250);
}

const gTitle = t => t >= ROUNDS * 80 ? ["Su Dedektifi", "award"] : t >= ROUNDS * 55 ? ["Damla Avcısı", "drop"] : t >= ROUNDS * 30 ? ["Meraklı Gezgin", "leaf"] : ["Yolun Başında", "sprout"];

function guessEnd(boardOnly) {
  cur = "gplay"; segs.hidden = !!boardOnly;
  const me = store.get("me") || {};
  if (boardOnly) {
    setCat("food");
    setBand(`<div class="kicker"><span>Tahmin et · pano</span></div><div class="gcode">${me.group ? esc(me.group) : "KOD?"}</div>`);
  } else {
    const total = G.res.reduce((a, x) => a + x.s, 0), [tn, ti] = gTitle(total);
    G.total = total;
    if (total > (store.get("guessBest") || 0)) store.set("guessBest", total);
    setSegs(ROUNDS, ROUNDS); setCat(total >= ROUNDS * 55 ? "water" : "home");
    setBand(`<div class="kicker"><span>Toplam puanın</span></div>
      <div class="big" id="gBig">0</div><div class="bigunit">/ ${ROUNDS * 100} puan</div><span class="stamp">${ic(ti)}${tn}</span>`);
  }
  const res = boardOnly ? "" : `<h3>Tahminlerin</h3><ol class="list gres">${G.res.map((x, k) => `<li style="animation-delay:${300 + k * 70}ms"><span class="n">${k + 1}</span><div><b>${x.n}</b><span>Sen ${fmt(x.g)} L · gerçek ${fmt(x.a)} L</span></div><em>+${x.s}</em></li>`).join("")}</ol>`;
  const el = swap(`${boardOnly ? "" : `<div class="card join"><span class="lab">Grubunla yarış</span>
      <div class="jrow"><label class="jf"><span>Adın</span><input id="gName" maxlength="24" value="${esc(me.name || "")}" placeholder="Örn. Elif"></label>
      <label class="jf"><span>Grup kodu</span><input id="gGroup" maxlength="12" value="${esc(me.group || "")}" placeholder="Örn. DOGA1"></label></div>
      <button class="btn" id="gSave" type="button">${ic("users")}Puanımı kaydet</button><span class="small" id="gMsg"></span></div>`}
    ${boardOnly ? `<div class="card"><span class="lab">Grup kodu</span><div class="jrow"><label class="jf" style="flex:1"><span class="sr">Grup kodu</span><input id="gGroup" maxlength="12" value="${esc(me.group || "")}" placeholder="Örn. DOGA1"></label><button class="btn ghost" id="gOpen" type="button" style="width:auto">Aç</button></div></div>` : ""}
    <div id="gList"></div>${res}`);
  const gIn = el.querySelector("#gGroup"); gIn.oninput = () => { gIn.value = cleanCode(gIn.value); };
  const list = el.querySelector("#gList");
  const show = async group => {
    if (!group) return;
    list.innerHTML = `<p class="small">Yükleniyor…</p>`;
    try {
      const res = await fetch(`${fsBase()}/groups/${encodeURIComponent(group)}/guess?pageSize=300&key=${FIREBASE.apiKey}`);
      if (!res.ok) throw 0;
      const ms = ((await res.json()).documents || []).map(d => Object.fromEntries(Object.entries(d.fields || {}).map(([k, x]) => [k, fromFs(x)]))).sort((a, b) => b.best - a.best);
      list.innerHTML = ms.length ? `<h3>${esc(group)} grubu</h3><ol class="list board gb"><li class="hd"><span>#</span><span>Ad</span><span>En iyi</span></li>${ms.map((m, k) => `<li><span class="n">${k + 1}</span><b class="nm">${esc(m.name)}</b><span class="tv">${fmt(m.best)}</span></li>`).join("")}</ol>` : `<p class="small">Bu grupta henüz puan yok. İlk sen ol.</p>`;
    } catch (e) { list.innerHTML = `<p class="small">Pano yüklenemedi.</p>`; }
  };
  if (boardOnly) {
    const open = () => { const g = cleanCode(gIn.value); if (g) { sfx.tap(); store.set("me", { ...me, group: g }); document.querySelector(".gcode").textContent = g; show(g); } };
    el.querySelector("#gOpen").onclick = open; gIn.onkeydown = e => { if (e.key === "Enter") open(); };
    show(me.group);
    actions.innerHTML = `<button class="btn" id="gPlay" type="button">${ic("drop")}Oyna</button>`;
    actions.querySelector("#gPlay").onclick = () => { sfx.tap(); guessIntro(); };
    return;
  }
  const msg = el.querySelector("#gMsg"), btn = el.querySelector("#gSave");
  btn.onclick = async () => {
    const name = cleanName(el.querySelector("#gName").value), group = cleanCode(gIn.value);
    if (!name || !group) { msg.textContent = "Adını ve grup liderinin verdiği kodu yaz."; return; }
    store.set("me", { name, group }); btn.disabled = true; msg.textContent = "Kaydediliyor…";
    try {
      const url = `${fsBase()}/groups/${encodeURIComponent(group)}/guess/${encodeURIComponent(memberKey(name))}?key=${FIREBASE.apiKey}`;
      const old = await fetch(url); let prev = {};
      if (old.ok) prev = Object.fromEntries(Object.entries((await old.json()).fields || {}).map(([k, x]) => [k, fromFs(x)]));
      else if (old.status !== 404) throw 0;
      const fields = { name, best: Math.max(prev.best || 0, G.total), plays: (prev.plays || 0) + 1 };
      const put = await fetch(url, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fields: Object.fromEntries(Object.entries(fields).map(([k, v]) => [k, toFs(v)])) }) });
      if (!put.ok) throw 0;
      sfx.win(); toast("Puanın kaydedildi"); msg.textContent = ""; btn.hidden = true; show(group);
    } catch (e) { btn.disabled = false; msg.textContent = "Kaydedilemedi. İnternet bağlantını kontrol edip tekrar dene."; }
  };
  if (me.group) show(me.group);
  actions.innerHTML = `<div class="row2"><button class="btn" id="gAgain" type="button">${ic("redo")}Tekrar oyna</button><button class="btn ghost" id="gHome" type="button" aria-label="Ana ekran">${ic("house")}</button></div>`;
  actions.querySelector("#gAgain").onclick = () => { sfx.tap(); guessIntro(); };
  actions.querySelector("#gHome").onclick = () => { sfx.back(); intro(); };
  sfx.win();
  setTimeout(() => { const b = document.getElementById("gBig"); countUp(b, G.total, 0, 1400); b.style.fontVariationSettings = `"YEAR" ${Math.round(2050 - G.total / (ROUNDS * 100) * 71)}`; burstAt(b, 26); }, 350);
}

addEventListener("keydown", e => { if (e.key === "Escape" && !backBtn.hidden) backBtn.click(); });
if (/tahmin/.test(location.hash)) guessIntro(); else intro();
</script>
</body>
</html>
