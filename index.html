<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Doğa ile Dönüş: su ve karbon ayak izini hesapla, rozetini kazan.">
<meta name="theme-color" content="#4b7a22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234b7a22'/%3E%3Cpath d='M12 4C9.5 7.3 7.5 9.7 7.5 12.3a4.5 4.5 0 0 0 9 0C16.5 9.7 14.5 7.3 12 4Z' fill='%23fff'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Doğa ile Dönüş Ayak İzi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a single app shell (top bar / scrolling screen / fixed action bar).
   Phone: fills the screen. Desktop: the same shell centered like a device over a quiet landscape. */
:root {
  --ground: #dfe9e5;
  --surface: #f7faf8;
  --panel: #ffffff;
  --ink: #12302b;
  --muted: #5d756f;
  --line: #dbe6e2;
  --water: #1f6fae;   --water-soft: #e1eef8;
  --energy: #b9741a;  --energy-soft: #f8ecd9;
  --move: #5b5fc7;    --move-soft: #e8e8f9;
  --food: #4b7a22;    --food-soft: #e5f0d9;
  --home: #c4562c;    --home-soft: #f8e4da;
  --hill1: #c9ddd5; --hill2: #b7d1c6;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #08110f; --surface: #101c19; --panel: #172622; --ink: #e4efeb; --muted: #93aba4; --line: #243731;
    --water: #72b6ea; --water-soft: #15304a; --energy: #e7aa55; --energy-soft: #3a2b14; --move: #a3a6f5; --move-soft: #26284a;
    --food: #9ccb6b; --food-soft: #20331a; --home: #f0956c; --home-soft: #3c2219; --hill1: #13221e; --hill2: #182b26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #08110f; --surface: #101c19; --panel: #172622; --ink: #e4efeb; --muted: #93aba4; --line: #243731;
  --water: #72b6ea; --water-soft: #15304a; --energy: #e7aa55; --energy-soft: #3a2b14; --move: #a3a6f5; --move-soft: #26284a;
  --food: #9ccb6b; --food-soft: #20331a; --home: #f0956c; --home-soft: #3c2219; --hill1: #13221e; --hill2: #182b26;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; overflow: hidden; display: grid; place-items: center; }
.backdrop { position: fixed; inset: auto 0 0 0; height: 45vh; pointer-events: none; }
.backdrop svg { width: 100%; height: 100%; display: block; }

.app { --cat: var(--food); --cat-soft: var(--food-soft); position: relative; width: 100%; height: 100%; background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; transition: --cat .3s; }
@media (min-width: 560px) {
  .app { width: 430px; height: min(880px, calc(100% - 48px)); border-radius: 34px; border: 1px solid var(--line); box-shadow: 0 40px 80px -40px rgba(10, 40, 34, .45), 0 0 0 8px color-mix(in srgb, var(--surface) 55%, transparent); }
}
.app[data-cat="water"] { --cat: var(--water); --cat-soft: var(--water-soft); }
.app[data-cat="energy"] { --cat: var(--energy); --cat-soft: var(--energy-soft); }
.app[data-cat="move"] { --cat: var(--move); --cat-soft: var(--move-soft); }
.app[data-cat="food"] { --cat: var(--food); --cat-soft: var(--food-soft); }
.app[data-cat="home"] { --cat: var(--home); --cat-soft: var(--home-soft); }

.i { width: 22px; height: 22px; flex: none; }
/* top bar */
.bar { display: grid; gap: 12px; padding: 14px 18px 12px; background: var(--surface); position: relative; z-index: 2; }
.bar-row { display: flex; align-items: center; gap: 10px; min-height: 42px; }
.brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.logo { width: 38px; height: 38px; flex: none; border-radius: 12px; background: linear-gradient(140deg, var(--water), var(--food)); display: grid; place-items: center; }
.logo svg { width: 22px; height: 22px; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: -.02em; white-space: nowrap; }
.wordmark b { color: var(--water); font-weight: 800; } .wordmark em { color: var(--food); font-style: normal; }
.icon-btn { flex: none; width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: grid; place-items: center; cursor: pointer; transition: transform .12s, background .2s; }
.icon-btn:active { transform: scale(.92); }
.icon-btn[hidden] { display: none !important; }
.meta { display: flex; align-items: center; gap: 10px; }
.meta[hidden] { display: none !important; }
.cat-chip { display: inline-flex; align-items: center; gap: 6px; font: 700 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--cat); background: var(--cat-soft); border-radius: 999px; padding: 5px 10px 5px 8px; transition: color .3s, background .3s; }
.cat-chip .i { width: 16px; height: 16px; }
.track { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.track div { height: 100%; width: 0; background: var(--cat); border-radius: 99px; transition: width .5s cubic-bezier(.3,1.3,.5,1), background .3s; }
.count { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* screen */
.screen { position: relative; overflow: hidden auto; overscroll-behavior: contain; }
.hills { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none; opacity: .5; }
.hills path { transition: fill .4s; }
.page { position: relative; z-index: 1; padding: 6px 20px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; min-height: 100%; }
.page.in { animation: pageIn .42s cubic-bezier(.2,1.1,.3,1) both; }
.page.in.back { animation-name: pageInBack; }
.page.out { position: absolute; inset: 0 0 auto 0; animation: pageOut .22s ease-in both; pointer-events: none; }
.page.out.back { animation-name: pageOutBack; }
@keyframes pageIn { from { opacity: 0; transform: translateX(36px); } }
@keyframes pageInBack { from { opacity: 0; transform: translateX(-36px); } }
@keyframes pageOut { to { opacity: 0; transform: translateX(-36px); } }
@keyframes pageOutBack { to { opacity: 0; transform: translateX(36px); } }
.q-ic { width: 56px; height: 56px; border-radius: 18px; background: var(--cat-soft); color: var(--cat); display: grid; place-items: center; animation: pop .5s cubic-bezier(.2,1.5,.4,1) both; }
.q-ic .i { width: 28px; height: 28px; }
h1, h2 { font-family: var(--display); font-weight: 800; margin: 0; line-height: 1.12; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: 34px; }
h2 { font-size: 27px; }
h3 { font: 700 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 -6px; }
.sub { color: var(--muted); margin: -8px 0 0; font-size: 15px; }
@keyframes pop { from { opacity: 0; transform: scale(.85) translateY(8px); } }

/* options */
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 46px minmax(0, 1fr) 24px; align-items: center; gap: 14px; width: 100%; text-align: left; font: 600 16px var(--body); color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 14px 12px 12px; cursor: pointer; animation: rise .45s cubic-bezier(.2,1.1,.3,1) both; transition: border-color .15s, transform .12s, background .2s; }
.opt:hover { border-color: color-mix(in srgb, var(--cat) 40%, var(--line)); }
.opt:active { transform: scale(.98); }
.opt .oi { width: 46px; height: 46px; border-radius: 14px; background: var(--cat-soft); color: var(--cat); display: grid; place-items: center; font: 800 18px var(--display); }
.opt small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); margin-top: 1px; }
.opt .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: var(--panel); transition: all .2s; }
.opt .radio .i { width: 14px; height: 14px; stroke-width: 3; }
.opt.sel { border-color: var(--cat); background: color-mix(in srgb, var(--cat-soft) 60%, var(--panel)); }
.opt.sel .radio { background: var(--cat); border-color: var(--cat); animation: tick .35s cubic-bezier(.2,1.6,.4,1); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes tick { from { transform: scale(.4); } }

/* number */
.numbox { background: var(--panel); border: 1.5px solid var(--line); border-radius: 22px; padding: 22px 18px 18px; display: grid; gap: 14px; }
.num { display: flex; align-items: center; justify-content: center; gap: 18px; }
.num button { width: 54px; height: 54px; border-radius: 16px; border: 0; background: var(--cat-soft); color: var(--cat); cursor: pointer; display: grid; place-items: center; transition: transform .1s; }
.num button:active { transform: scale(.9); }
.num output { font: 800 60px var(--display); min-width: 2.2ch; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
.num output.bump { animation: bump .25s ease; }
@keyframes bump { 50% { transform: scale(1.15); } }
.num-unit { text-align: center; color: var(--muted); font-weight: 600; margin-top: -6px; }
input[type=range] { width: 100%; accent-color: var(--cat); }

/* bill */
.billbox { background: var(--panel); border: 1.5px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 12px;  grid-template-columns: minmax(0, 1fr); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { font: 700 14px var(--body); border: 0; background: transparent; color: var(--muted); padding: 9px; border-radius: 9px; cursor: pointer; transition: all .2s; }
.seg button[aria-pressed=true] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.field { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--cat); padding: 4px 2px 6px; }
.field input { flex: 1; min-width: 0; width: 100%; font: 800 40px var(--display); border: 0; background: transparent; color: var(--ink); padding: 0; font-variant-numeric: tabular-nums; }
.field input:focus { outline: none; }
.field span { font: 700 16px var(--body); color: var(--muted); }
.conv { display: flex; align-items: center; gap: 6px; font: 500 14px var(--mono); color: var(--cat); min-height: 1.5em; }
.conv .i { width: 16px; height: 16px; }

/* action bar */
.actionbar { position: relative; z-index: 2; padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); display: grid; gap: 8px; }
.alt { display: flex; gap: 8px; }
.alt:empty { display: none; }
.btn { font: 700 16px var(--body); border: 0; border-radius: 16px; padding: 15px 18px; background: var(--ink); color: var(--surface); cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: transform .12s, opacity .2s, background .3s; width: 100%; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--cat); color: var(--panel); }
:root:not([data-theme="light"]) .btn.primary { color: var(--surface); }
.btn.ghost { background: var(--panel); color: var(--ink); border: 1.5px solid var(--line); padding: 11px 14px; font-size: 14px; }
.btn[disabled] { opacity: .35; cursor: default; }
.btn .i { width: 20px; height: 20px; }
.hint { text-align: center; font-size: 13px; color: var(--muted); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }

/* intro */
.hero { position: relative; border-radius: 26px; background: linear-gradient(160deg, var(--water-soft), var(--food-soft)); display: grid; place-items: center; padding: 18px 0 10px; overflow: hidden; }
.globe { width: 190px; height: auto; overflow: visible; animation: float 5s ease-in-out infinite; }
.globe .waves { animation: wave 6s linear infinite; }
.globe .orbit { transform-origin: 100px 100px; animation: spin 14s linear infinite; }
.globe .orbit.r { animation-direction: reverse; animation-duration: 18s; }
@keyframes float { 50% { transform: translateY(-7px); } }
@keyframes wave { to { transform: translateX(-80px); } }
@keyframes spin { to { transform: rotate(360deg); } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: grid; gap: 4px; justify-items: start; animation: rise .5s both; }
.stat .i { width: 18px; height: 18px; color: var(--water); }
.stat:nth-child(2) .i { color: var(--food); } .stat:nth-child(3) .i { color: var(--home); }
.stat b { font: 800 18px var(--display); line-height: 1; } .stat span { font-size: 12px; color: var(--muted); }
.steps { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; }
.steps li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 14px; animation: rise .5s both; }
.steps li + li { border-top: 1px solid var(--line); }
.steps .si { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.steps li:nth-child(1) .si { background: var(--home-soft); color: var(--home); }
.steps li:nth-child(2) .si { background: var(--water-soft); color: var(--water); }
.steps li:nth-child(3) .si { background: var(--food-soft); color: var(--food); }
.steps b { display: block; font-size: 15px; } .steps span { font-size: 13px; color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bdg { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.2; animation: rise .5s both; }
.bdg .bi { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed var(--line); color: var(--muted); }
.bdg.on .bi { border-style: solid; }

/* result */
.res-hero { border-radius: 26px; padding: 20px; background: linear-gradient(160deg, var(--water-soft), var(--food-soft)); display: grid; justify-items: center; gap: 8px; text-align: center; }
.medal { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); color: var(--food); box-shadow: 0 0 0 6px color-mix(in srgb, var(--panel) 50%, transparent); animation: medal .8s .2s cubic-bezier(.2,1.6,.4,1) both; }
.medal .i { width: 42px; height: 42px; }
@keyframes medal { from { opacity: 0; transform: scale(.3) rotate(-40deg); } }
.res-hero small { font: 700 12px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.res-hero h2 { font-size: 28px; }
.meters { display: grid; gap: 10px; }
.meter { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 8px; }
.mh { display: flex; align-items: center; gap: 10px; }
.mh .mi { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; }
.meter.c .mi { background: var(--food-soft); color: var(--food); } .meter.w .mi { background: var(--water-soft); color: var(--water); }
.mh span { font-weight: 700; font-size: 14px; }
.val { font: 800 44px var(--display); line-height: 1; font-variant-numeric: tabular-nums; }
.meter.c .val { color: var(--food); } .meter.w .val { color: var(--water); }
.val small { font: 600 14px var(--body); color: var(--muted); margin-left: 6px; }
.ref { position: relative; height: 10px; background: var(--surface); border-radius: 99px; }
.ref .me { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; transition: width 1.2s cubic-bezier(.2,1,.3,1); }
.meter.c .me { background: var(--food); } .meter.w .me { background: var(--water); }
.ref .avg { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--ink); border-radius: 2px; }
.cmp { font-size: 13px; color: var(--muted); } .cmp b { color: var(--ink); }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; margin: 0; padding: 0; list-style: none; }
.list > li { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px; animation: rise .5s both; }
.list > li + li { border-top: 1px solid var(--line); }
.list .li { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font: 800 17px var(--display); }
.tips .li { background: var(--home-soft); color: var(--home); }
.facts .li { background: var(--water-soft); color: var(--water); }
.list b { display: block; font-size: 15px; line-height: 1.35; } .list span, .list p { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
.bars { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: grid; gap: 9px; }
.br { display: grid; grid-template-columns: 92px minmax(0, 1fr) 58px; gap: 8px; align-items: center; font-size: 13px; }
.br .t { height: 8px; background: var(--surface); border-radius: 99px; overflow: hidden; }
.br .f { height: 100%; width: 0; border-radius: 99px; transition: width 1s cubic-bezier(.2,1,.3,1); }
.br.c .f { background: var(--food); } .br.w .f { background: var(--water); }
.br .v { text-align: right; font: 500 12px var(--mono); }
.note { font-size: 12px; color: var(--muted); margin: 0; }
details.data { font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
details.data summary { cursor: pointer; font-weight: 700; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n { font-family: var(--mono); white-space: nowrap; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.row2 .btn.ghost { width: auto; padding: 0 16px; }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--surface); font: 600 14px var(--body); padding: 10px 16px; border-radius: 12px; transition: all .3s; pointer-events: none; z-index: 5; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <svg viewBox="0 0 1440 400" preserveAspectRatio="none"><path d="M0 260 C240 170 420 300 720 220 S1200 150 1440 230 V400 H0Z" fill="var(--hill1)"/><path d="M0 320 C300 250 520 360 860 300 S1260 260 1440 310 V400 H0Z" fill="var(--hill2)"/></svg>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="app" id="app" data-cat="food">
  <header class="bar">
    <div class="bar-row">
      <button class="icon-btn" id="backBtn" type="button" aria-label="Geri" hidden></button>
      <span class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5C8.5 7 6 10.2 6 13.6a6 6 0 0 0 12 0C18 10.2 15.5 7 12 2.5Z" fill="#fff" fill-opacity=".95"/><path d="M12 19.5v-6.2m0 0c0-2 1.4-3.3 3.2-3.6M12 13.3c-.3-1.6-1.4-2.6-2.9-2.9" stroke="#3d7a2a" stroke-width="1.7" stroke-linecap="round"/></svg></span>
        <span class="wordmark"><b>Doğa</b> ile <em>Dönüş</em></span>
      </span>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="Sesi kapat"></button>
    </div>
    <div class="meta" id="meta" hidden>
      <span class="cat-chip" id="catChip"></span>
      <div class="track" aria-hidden="true"><div id="prog"></div></div>
      <span class="count" id="count"></span>
    </div>
  </header>
  <section class="screen" id="screen">
    <svg class="hills" viewBox="0 0 430 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70 C80 40 150 90 230 62 S360 40 430 66 V120 H0Z" fill="var(--cat-soft)"/><path d="M0 96 C90 76 170 112 270 92 S380 84 430 98 V120 H0Z" fill="var(--cat-soft)"/></svg>
  </section>
  <footer class="actionbar" id="actions"></footer>
  <div class="toast" id="toast" role="status"></div>
</main>

<script>
// ===== Fiyatlar ve katsayılar: güncellemek için sadece bu bloğu düzenle =====
const DATA = {
  updated: "22 Ekim 2026",
  price: {

  for (let i = 0; i < n; i++) {

function waterTlToM3(tl) {
  let m3 = 0;
  for (const [size, price] of DATA.price.waterTiers.v) { const cost = size * price; if (tl <= cost) return m3 + tl / price; m3 += size; tl -= cost; }
  return m3;
}
function waterM3ToTl(m3) {
  let tl = 0;
  for (const [size, price] of DATA.price.waterTiers.v) { const u = Math.min(m3, size); tl += u * price; m3 -= u; if (m3 <= 0) break; }
  return tl;
}
// bill answer: {mode: "tl"|"q"|"none"|"unk", v}
function billQty(id) {
  const b = A[id]; if (!b) return null;
  if (b.mode === "none") return 0;
  if (b.mode === "unk") return null;
  if (b.mode === "q") return b.v;
  const st = STEPS.find(s => s.id === id);
  return st.water ? waterTlToM3(b.v) : b.v / st.price();
}
function calc() {
  const dorm = isDorm(), E = DATA.estimate, W = DATA.water, C = DATA.co2;
  const people = dorm ? 1 : Math.max(1, A.people || 1);
  let elecPP, gasPP, directL, estimated = [];
  if (dorm) {
    elecPP = E.dormElec.v + (A.heater === "elektrik" ? E.heater.v : 0) - (A.room > 1 ? 5 * (A.room - 1) : 0);
    gasPP = A.heater === "elektrik" ? E.dormGas.v * .3 : E.dormGas.v;
  } else {
    const e = billQty("elec"), g = billQty("gas");
    elecPP = e == null ? (estimated.push("elektrik"), E.homeElec.v) : e / people;
    gasPP = g == null ? (estimated.push("doğalgaz"), E.homeGas.v) : g / people;
  }
  const showerMin = (A.showerFreq ?? 7) / 7 * (A.shower ?? 8);
  const habitL = showerMin * W.shower.v + W.toilet.v + (A.tap ? W.tapOpen.v : 4) + (dorm ? 5 : W.kitchen.v);
  const wq = dorm ? null : billQty("water");
  if (wq == null) { directL = habitL; if (!dorm) estimated.push("su"); } else directL = wq * 1000 / 30 / people;

  let car = 0;
  if (A.commute === "araba") {
    if (A.fuelType === "elektrik") car = 150 * 12 * C.elec.v;
    else { const f = billQty("fuel"); car = (f || 0) * C[A.fuelType].v * 12; }
  }
  const transitH = (A.commute === "toplu" || A.commute === "servis") ? (A.transit || 0) : 0;
  const co2 = {
    "Ev enerjisi": (elecPP * C.elec.v + gasPP * C.gas.v) * 12,
    "Ulaşım": car + transitH * 52 * C.transit.v,
    "Uçuş": (A.flyDom || 0) * C.flyDom.v + (A.flyInt || 0) * C.flyInt.v,
    "Beslenme": C.diet.v[A.diet || "medium"],
    "Alışveriş": (A.clothes || 0) * 12 * C.clothes.v + (A.bottle || 0) * 52 * C.bottle.v[A.bottleSize || "small"]
  };
  const water = {
    "Evde kullanım": directL,
    "Yiyecek": W.diet.v[A.diet || "medium"],
    "Kıyafet": (A.clothes || 0) * 12 * W.clothes.v / 365,
    "Pet şişe": (A.bottle || 0) / 7 * W.bottle.v[A.bottleSize || "small"]
  };
  return { co2, water, directL, habitL, car, elecPP, estimated, totalCo2: Object.values(co2).reduce((a, b) => a + b, 0) / 1000, totalW: Object.values(water).reduce((a, b) => a + b, 0) };
}
const fmt = (n, d = 0) => n.toLocaleString("tr-TR", { maximumFractionDigits: d, minimumFractionDigits: d });

function tips(r) {
  const L = [], W = DATA.water, C = DATA.co2;
  const sh = A.shower ?? 8, sf = A.showerFreq ?? 7;
  if (sf > 0 && sh > 5) { const l = (sh - 5) * W.shower.v * sf * 52; L.push({ s: l * .02, t: `Duşu ${sh} dakikadan 5 dakikaya indir`, d: `Yılda yaklaşık ${fmt(l)} litre su kurtarırsın.` }); }
  if (A.tap) L.push({ s: W.tapOpen.v * 365 * .02, t: "Diş fırçalarken musluğu kapat", d: `Yılda yaklaşık ${fmt((W.tapOpen.v - 4) * 365)} litre su.` });
  const order = ["high", "medium", "low", "fish", "veg", "vegan"], i = order.indexOf(A.diet);
  if (i >= 0 && i < 2) {
    const n = order[i + 1], dc = C.diet.v[A.diet] - C.diet.v[n], dw = W.diet.v[A.diet] - W.diet.v[n];
    L.push({ s: dc, t: "Haftada 3–4 gün etsiz beslen", d: `Yılda yaklaşık ${fmt(dc)} kg CO₂ ve günde ${fmt(dw)} litre sanal su.` });
  }
  if (r.car > 100) L.push({ s: r.car * .3, t: "Kısa yolları yürü ya da bisiklete bin", d: `Araba kullanımını %30 azaltmak yılda ${fmt(r.car * .3)} kg CO₂ eder.` });
  const fd = (A.flyDom || 0) * C.flyDom.v;
  if (fd > 0) L.push({ s: fd * .8, t: "Yurt içinde uçak yerine tren ya da otobüs dene", d: `Yılda yaklaşık ${fmt(fd * .8)} kg CO₂ daha az.` });
  if (isDorm() && A.heater === "elektrik") L.push({ s: DATA.estimate.heater.v * 12 * C.elec.v * .5, t: "Odadaki ısıtıcıyı daha az çalıştır, kat kat giyin", d: `Isıtıcıyı yarı yarıya azaltmak yılda ${fmt(DATA.estimate.heater.v * 6 * C.elec.v)} kg CO₂.` });
  const home = r.co2["Ev enerjisi"];
  if (!isDorm() && home > 50) L.push({ s: home * .1, t: "Bekleme modundaki cihazları kapat, kombiyi 1 °C düşür", d: `Ev enerjinde yaklaşık %10, kişi başı yılda ${fmt(home * .1)} kg CO₂.` });
  if ((A.bottle || 0) > 0) { const bc = A.bottle * 52 * C.bottle.v[A.bottleSize || "small"]; L.push({ s: bc, t: "Pet şişe yerine matara taşı", d: `Yılda ${fmt(A.bottle * 52)} şişe ve ${fmt(bc)} kg CO₂ daha az.` }); }
  if ((A.clothes || 0) > 0) L.push({ s: A.clothes * 6 * C.clothes.v, t: "Yeni kıyafetin yarısını ikinci el ya da takasla al", d: `Yılda ${fmt(A.clothes * 6 * C.clothes.v)} kg CO₂ ve ${fmt(A.clothes * 6 * W.clothes.v)} litre su.` });
  return L.sort((a, b) => b.s - a.s).slice(0, 3);
}

    inp.onkeydown = e => { if (e.key === "Enter") actions.querySelector("#nx").click(); };
    actions.querySelector("#nx").onclick = e => { A[s.id] = { mode, v: Math.max(0, parseFloat(inp.value) || 0) }; sfx.tap(); burstAt(e.currentTarget, 8); next(); };
    actions.querySelector("#unk").onclick = () => { A[s.id] = { mode: "unk" }; sfx.tap(); next(); };
    if (s.none) actions.querySelector("#none").onclick = () => { A[s.id] = { mode: "none" }; sfx.tap(); next(); };
  }
  sfx.next();
}
function next() {
  const vis = visible(), pos = vis.indexOf(STEPS[cur]);
  if (pos < vis.length - 1) go(STEPS.indexOf(vis[pos + 1]), 1); else { history.push(cur); result(); }
}
backBtn.onclick = () => { sfx.back(); if (!history.length) return intro(); go(history.pop(), -1); };

function countUp(el, to, d, ms = 1400) {
  if (reduce) { el.firstChild.nodeValue = fmt(to, d); return; }
  const t0 = performance.now(); let last = 0;
  const step = now => {
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.firstChild.nodeValue = fmt(to * e, d);
    if (now - last > 70 && k < 1) { sfx.tick(); last = now; }
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function result() {
  cur = "done"; setBar();
  const r = calc(), t = tips(r), p = persona(r.totalCo2);
  const barsHtml = (obj, cls, f) => { const max = Math.max(...Object.values(obj), 1); return Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="br ${cls}"><span>${k}</span><div class="t"><div class="f" data-w="${(v / max * 100).toFixed(1)}"></div></div><span class="v">${f(v)}</span></div>`).join(""); };
  const sc = Math.max(r.totalCo2, DATA.avg.co2.v) * 1.1, sw = Math.max(r.totalW, DATA.avg.water.v) * 1.1;
  const pc = Math.round((r.totalCo2 / DATA.avg.co2.v - 1) * 100), pw = Math.round((r.totalW / DATA.avg.water.v - 1) * 100);
  const rel = x => x >= 0 ? `<b>%${x} üstündesin</b>` : `<b>%${-x} altındasın</b>`;
  const el = swap(`
    <div class="res-hero"><span class="medal">${ic(p.i)}</span><small>Rozetin</small><h2>${p.n}</h2></div>
    <div class="meters">
      <div class="meter c"><div class="mh"><span class="mi">${ic("leaf")}</span><span>Karbon ayak izi</span></div>
        <div class="val" id="vc">0<small>ton CO₂ / yıl</small></div>
        <div class="ref"><div class="me" data-w="${(r.totalCo2 / sc * 100).toFixed(1)}"></div><div class="avg" style="left:${(DATA.avg.co2.v / sc * 100).toFixed(1)}%"></div></div>
        <span class="cmp">Çizgi Türkiye ortalaması (${fmt(DATA.avg.co2.v, 1)} t). Sen ${rel(pc)}.</span></div>
      <div class="meter w"><div class="mh"><span class="mi">${ic("drop")}</span><span>Su ayak izi</span></div>
        <div class="val" id="vw">0<small>litre / gün</small></div>
        <div class="ref"><div class="me" data-w="${(r.totalW / sw * 100).toFixed(1)}"></div><div class="avg" style="left:${(DATA.avg.water.v / sw * 100).toFixed(1)}%"></div></div>
        <span class="cmp">Çizgi dünya ortalaması (${fmt(DATA.avg.water.v)} L). Sen ${rel(pw)}.</span></div>
    </div>
    <h3>Senin için en etkili 3 adım</h3>
    <ol class="list tips">${t.length ? t.map((x, k) => `<li style="animation-delay:${700 + k * 150}ms"><span class="li">${k + 1}</span><div><b>${x.t}</b><span>${x.d}</span></div></li>`).join("") : `<li><span class="li">${ic("check")}</span><div><b>Harika gidiyorsun</b><span>Büyük bir tasarruf alanı görünmüyor. Bildiklerini gruba anlat.</span></div></li>`}</ol>
    <h3>Nereden geliyor?</h3>
    <div class="bars">${barsHtml(r.co2, "c", v => v >= 1000 ? fmt(v / 1000, 1) + " t" : fmt(v) + " kg")}</div>
    <div class="bars">${barsHtml(r.water, "w", v => fmt(v) + " L")}</div>
    <p class="note">Evde doğrudan kullandığın su günde ${fmt(r.directL)} litre${r.estimated.length ? `. Bilmediğin ${r.estimated.join(", ")} için ortalama değer kullanıldı` : ""}${isDorm() ? ". Yurt enerjisi öğrenci başına tahmini paydır" : ""}. Türkiye ortalaması sanayi dahil tüm sektörleri içerir, kişisel hesap genelde daha düşük çıkar.</p>
    <h3>Biliyor muydun?</h3>
    <ul class="list facts">${FACTS.map((f, k) => `<li style="animation-delay:${1100 + k * 100}ms"><span class="li">${ic(f[0])}</span><p>${f[1]}</p></li>`).join("")}</ul>
    <details class="data"><summary>Fiyatlar, katsayılar ve kaynaklar</summary><div class="tbl"><table><thead><tr><th>Kalem</th><th>Değer</th><th>Kaynak</th></tr></thead><tbody>${dataRows()}</tbody></table></div>
    <p class="note">Yöntem: TL ÷ birim fiyat = miktar; miktar × emisyon katsayısı = kg CO₂. Su ayak izi = evde doğrudan kullanım + sanal su (yiyecek, kıyafet, pet şişe üretimi). Sonuçlar farkındalık amaçlı yaklaşık değerlerdir. Son güncelleme: ${DATA.updated}.</p></details>`);
  actions.innerHTML = `<div class="row2"><button class="btn primary" id="copy" type="button">${ic("copy")}Sonucu kopyala</button><button class="btn ghost" id="again" type="button" aria-label="Baştan başla">${ic("redo")}</button></div>`;
  sfx.win();
  setTimeout(() => {
    countUp(el.querySelector("#vc"), r.totalCo2, 1); countUp(el.querySelector("#vw"), r.totalW, 0);
    el.querySelectorAll("[data-w]").forEach(x => x.style.width = x.dataset.w + "%");
    burstAt(el.querySelector(".medal"), 60);
  }, 300);
  actions.querySelector("#again").onclick = () => { for (const k in A) delete A[k]; sfx.back(); intro(); };
  actions.querySelector("#copy").onclick = () => {
    const txt = `Doğa ile Dönüş ayak izim (${p.n}):\n• Karbon: ${fmt(r.totalCo2, 1)} ton CO₂/yıl (Türkiye ort. ${fmt(DATA.avg.co2.v, 1)})\n• Su: ${fmt(r.totalW)} L/gün (dünya ort. ${fmt(DATA.avg.water.v)})\nHedeflerim:\n${t.map(x => "- " + x.t).join("\n")}`;
    const fail = () => { const n = document.createElement("p"); n.className = "note"; n.style.whiteSpace = "pre-line"; n.textContent = txt; el.appendChild(n); n.scrollIntoView({ behavior: "smooth" }); toast("Metni seçip kopyalayabilirsin"); };
    try { navigator.clipboard.writeText(txt).then(() => { sfx.pick(); toast("Kopyalandı, gruba yapıştırabilirsin"); }, fail); } catch (e) { fail(); }
  };
}
function dataRows() {
  const rows = [], f = o => typeof o.v === "object" && !Array.isArray(o.v) ? Object.values(o.v).map(x => fmt(x)).join(" / ") : Array.isArray(o.v) ? o.v.map(x => fmt(x[1], 2)).join(" / ") : fmt(o.v, o.v < 10 ? 2 : 0);
  const names = { elec: "Elektrik", gas: "Doğalgaz", benzin: "Benzin", motorin: "Motorin", lpg: "LPG", waterTiers: "Su (İSKİ kademeleri)", transit: "Toplu taşıma", flyDom: "Yurt içi uçuş", flyInt: "Yurt dışı uçuş", clothes: "Kıyafet", bottle: "Pet şişe", diet: "Beslenme", homeElec: "Ev elektriği (tahmin)", homeGas: "Ev doğalgazı (tahmin)", dormElec: "Yurt elektriği", dormGas: "Yurt ısınması", heater: "Odada ısıtıcı", shower: "Duş", toilet: "Tuvalet", tapOpen: "Açık musluk", kitchen: "Mutfak", co2: "Türkiye ortalaması", water: "Su ortalaması" };
  for (const grp of ["price", "co2", "estimate", "water", "avg"]) for (const [k, o] of Object.entries(DATA[grp])) rows.push(`<tr><td>${names[k] || k}</td><td class="n">${f(o)} ${o.unit}</td><td>${o.src}</td></tr>`);
  return rows.join("");
}

addEventListener("keydown", e => { if (e.key === "Escape" && !backBtn.hidden) backBtn.click(); });
intro();
</script>
